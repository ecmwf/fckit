[package]
name = "fckit"
repo = "ecmwf/fckit"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

# fckit[mpi] is built against eckit[mpi].
[[deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
options-input = "options"

[matrix.build.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
options = ""

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
fortran-compiler = "gfortran-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-15"
c-compiler = "gcc-15"
fortran-compiler = "gfortran-15"
container = "eccr.ecmwf.int/public-ci-images/ubuntu26.04-gcc15-gfortran15"
platform = "ubuntu-26.04"

[[matrix.build.include]]
cxx-compiler = "g++-8"
c-compiler = "gcc-8"
fortran-compiler = "gfortran-8"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gcc8-gfortran8"
platform = "rocky-8"

[[matrix.build.include]]
cxx-compiler = "g++-11"
c-compiler = "gcc-11"
fortran-compiler = "gfortran-11"
container = "eccr.ecmwf.int/public-ci-images/rocky9-gcc11-gfortran11"
platform = "rocky-9"

[[matrix.build.include]]
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
fortran-compiler = "gfortran-14"
container = "eccr.ecmwf.int/public-ci-images/rocky10-gcc14-gfortran14"
platform = "rocky-10"

[[matrix.build.include]]
cxx-compiler = "g++-10"
c-compiler = "gcc-10"
fortran-compiler = "gfortran-10"
container = "eccr.ecmwf.int/public-ci-images/debian11-gcc10-gfortran10"
platform = "debian-11"

[[matrix.build.include]]
cxx-compiler = "g++-12"
c-compiler = "gcc-12"
fortran-compiler = "gfortran-12"
container = "eccr.ecmwf.int/public-ci-images/debian12-gcc12-gfortran12"
platform = "debian-12"

[[matrix.build.include]]
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
fortran-compiler = "gfortran-14"
container = "eccr.ecmwf.int/public-ci-images/debian13-gcc14-gfortran14"
platform = "debian-13"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
fortran-compiler = "gfortran-13"
options = "mpi"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-openmpi:latest"
platform = "ubuntu-24.04"

[matrix.build]
triggers = ["upstream-change", "rebuild-request"]

[matrix.build-hpc.defaults]
job-script = "./.ci/build.sh.j2"
cxx-compiler = "g++-8"
fortran-compiler = "gfortran-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja", "load python3/3.12.9-01"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
fortran-compiler-binary = "gfortran"
time = "00:40:00"

[[matrix.build-hpc.include]]
options = ""

[[matrix.build-hpc.include]]
options = "mpi"
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja", "load python3/3.12.9-01", "load openmpi"]

[matrix.build-hpc]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

[[trigger-downstream]]
repo = "ecmwf/atlas"
ref = "develop"
