name: old CI

on:
  # Trigger the workflow after the new CI succeeded on a push
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'master'
      - 'develop'

  # Trigger the workflow manually
  workflow_dispatch: ~

# Every job is off: they run outside the Kubernetes runners, which may trust the compromised eMudhra CAs (Oct 2026).
jobs:
  # Run CI including downstream packages on self-hosted runners
  downstream-ci:
    name: downstream-ci
    if: ${{ false && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')) }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci.yml@main
    with:
      ci_group: only-self
      fckit: ecmwf/fckit@${{ github.event.workflow_run.head_sha || github.sha }}
      codecov_upload: true
    secrets: inherit

  # Build downstream packages on HPC
  downstream-ci-hpc:
    name: downstream-ci-hpc
    if: ${{ false && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')) }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci-hpc.yml@main
    with:
      ci_group: only-self
      fckit: ecmwf/fckit@${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
